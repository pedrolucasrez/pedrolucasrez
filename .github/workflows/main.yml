# Salve este arquivo em: .github/workflows/snake.yml (em um repositório com o mesmo nome do seu usuário, ex: pedrorez/pedrorez)
name: Generate Snake

on:
  schedule:
    - cron: "0 */6 * * *" # roda a cada 6 horas
  push:
    branches:
      - main
  workflow_dispatch: {}

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Generate red/black snake SVG
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#C1121F
          # Paleta customizada preto/vermelho:
          # snk permite ajustar via query params: color_snake, color_dots

      - name: Push snake svg to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
