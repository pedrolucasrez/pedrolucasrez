# Salve este arquivo em: .github/workflows/snake.yml (em um repositório com o mesmo nome do seu usuário, ex: pedrorez/pedrorez)
name: Generate Snake

on:
  schedule:
    - cron: "0 */6 * * *" # roda a cada 6 horas
  push:
    branches:
      - main
  workflow_dispatch: {}

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Generate red/black snake SVG
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#C1121F&color_dots=#0D0D0D,#3A0D0D,#6B1414,#A31621,#FF3333&color_background=#0D0D0D
          # color_dots: 5 cores obrigatórias, da menor contribuição (índice 0) até a maior (índice 4)
          # color_snake: cor do corpo da cobrinha
          # color_background: só é usada se o output for .gif, mas não faz mal deixar aqui

      - name: Push snake svg to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
